name: Windows Build and Release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
          architecture: x64
          cache: pip
          cache-dependency-path: release_tools/build-requirements.lock
      - name: Install locked build dependencies
        run: python -m pip install --require-hashes -r release_tools/build-requirements.lock
      - name: Compile source
        run: python -m compileall -q main.py scripts release_tools
      - name: Build and verify executable
        shell: pwsh
        run: |
          $versionArgs = @()
          if ($env:GITHUB_REF_TYPE -eq 'tag') { $versionArgs = @('--version', $env:GITHUB_REF_NAME) }
          python release_tools/build_windows.py @versionArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: windows-x64
          path: |
            dist/dfAmmo-v*-windows-x64.zip
            dist/dfAmmo-v*-windows-x64.sha256
            dist/build-report.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Upload startup diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-diagnostics
          path: |
            dist/smoke-test.json
            dist/smoke-test.png
            build/dfammo/warn-*.txt
          if-no-files-found: ignore
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-x64
          path: release-assets
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" release-assets/* \
            --verify-tag --title "dfAmmo $TAG" --notes-file release_tools/RELEASE_NOTES.md
      # One-time replacement requested by the maintainer; retain the historical tag.
      - name: Withdraw superseded initial release
        if: github.ref_name == 'v0.1.1'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tags="$(gh api "repos/$GH_REPO/releases" --paginate --jq '.[].tag_name')"
          if grep -Fxq 'v0.1.0' <<< "$tags"; then
            gh release delete v0.1.0 --yes
          fi
